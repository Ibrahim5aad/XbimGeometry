name: Build & Test

on:
  push:
    branches: [native-engine]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [native-engine]
    paths-ignore: ['*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        default: 'all'
        options: [all, linux, windows]

env:
  BUILD_CONFIG: Release
  DOTNET_VERSION: '8.0.x'
  VCPKG_COMMIT: 'b322364f06308bdd24823f9d8f03fe0cc86fd46f'  # 2024.12.16
  GLIBC_TUNABLES: glibc.rtld.optional_static_tls=2048
  
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          (github.event_name == 'workflow_dispatch' && inputs.platform == 'linux')
            && '[{"os":"ubuntu-24.04","rid":"linux-x64","cmake-preset":"linux-x64-release","build-parallel":"-j $(nproc)"}]'
          || (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows')
            && '[{"os":"windows-2022","rid":"win-x64","cmake-preset":"win-x64-release","build-parallel":"--parallel"}]'
          || '[{"os":"ubuntu-24.04","rid":"linux-x64","cmake-preset":"linux-x64-release","build-parallel":"-j $(nproc)"},{"os":"windows-2022","rid":"win-x64","cmake-preset":"win-x64-release","build-parallel":"--parallel"}]'
          ) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── .NET SDK ──────────────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Linux: install native build tools ─────────────────────────────
      - name: Install native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ pkg-config

      # ── vcpkg setup + caching ─────────────────────────────────────────
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.rid }}-${{ hashFiles('src/Xbim.Geometry.Engine.Native/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.rid }}-

      # ── Native C++ build ──────────────────────────────────────────────
      - name: Configure native build
        shell: bash
        run: cmake --preset ${{ matrix.cmake-preset }} -S src/Xbim.Geometry.Engine.Native "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/src/Xbim.Geometry.Engine.Native/triplets/release"

      - name: Dump vcpkg logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== vcpkg build logs ==="
          for f in src/Xbim.Geometry.Engine.Native/build/vcpkg_installed/vcpkg/issue_body.md \
                   vcpkg/buildtrees/opencascade/install-*-out.log \
                   vcpkg/buildtrees/opencascade/config-*-out.log; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              tail -80 "$f"
            fi
          done

      - name: Build native library
        shell: bash
        run: cmake --build src/Xbim.Geometry.Engine.Native/build --config ${{ env.BUILD_CONFIG }} ${{ matrix.build-parallel }}

      - name: Stage native binaries
        shell: bash
        run: |
          cmake --install src/Xbim.Geometry.Engine.Native/build \
            --config ${{ env.BUILD_CONFIG }} \
            --prefix src/Xbim.Geometry.Engine.Interop

      - name: Verify staged native binaries
        shell: bash
        run: |
          echo "=== Staged native binaries ==="
          ls -lR src/Xbim.Geometry.Engine.Interop/runtimes/ || echo "WARNING: runtimes directory not found"
          if [ -f src/Xbim.Geometry.Engine.Interop/runtimes/${{ matrix.rid }}/native/libxbim_geometry_native.so ]; then
            echo "=== Shared library dependencies ==="
            ldd src/Xbim.Geometry.Engine.Interop/runtimes/${{ matrix.rid }}/native/libxbim_geometry_native.so || true
          fi

      # ── .NET build + test ─────────────────────────────────────────────
      - name: Restore .NET
        run: dotnet restore Xbim.Geometry.Engine.sln

      - name: Build .NET
        run: dotnet build Xbim.Geometry.Engine.sln -c ${{ env.BUILD_CONFIG }} --no-restore

      - name: Ensure native libraries in test output
        shell: bash
        run: |
          native_src="src/Xbim.Geometry.Engine.Interop/runtimes/${{ matrix.rid }}/native"
          for test_dir in tests/Xbim.Geometry.UnitTests tests/Xbim.Geometry.IntegrationTests; do
            dest="$test_dir/bin/${{ env.BUILD_CONFIG }}/net8.0/runtimes/${{ matrix.rid }}/native"
            mkdir -p "$dest"
            cp -v "$native_src"/* "$dest/" 2>/dev/null || echo "NOTE: no files to copy to $dest"
          done

      - name: Run unit tests
        shell: bash
        run: |
          dotnet test tests/Xbim.Geometry.UnitTests/Xbim.Geometry.UnitTests.csproj \
            -c ${{ env.BUILD_CONFIG }} --no-build \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ${{ github.workspace }}/test-results

      - name: Run integration tests
        shell: bash
        run: |
          dotnet test tests/Xbim.Geometry.IntegrationTests/Xbim.Geometry.IntegrationTests.csproj \
            -c ${{ env.BUILD_CONFIG }} --no-build \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ${{ github.workspace }}/test-results

      # ── Artifacts ─────────────────────────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: ${{ github.workspace }}/test-results/
          retention-days: 14

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/Xbim.Geometry.Engine.Interop/runtimes/${{ matrix.rid }}/native/
          retention-days: 14
