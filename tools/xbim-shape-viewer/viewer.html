<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' {{cspSource}}; style-src 'unsafe-inline';">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    canvas { display: block; }
    #info {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 6px 12px;
        background: rgba(30, 30, 30, 0.85);
        color: #ccc; font-size: 11px;
        display: flex; justify-content: space-between; align-items: center;
    }
    #info .controls { color: #888; }
    #toolbar {
        position: absolute; top: 8px; right: 8px;
        display: flex; gap: 4px;
    }
    #toolbar button {
        background: rgba(30, 30, 30, 0.8); color: #ccc;
        border: 1px solid #555; border-radius: 3px;
        padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    #toolbar button:hover { background: rgba(60, 60, 60, 0.9); color: #fff; }
    #toolbar button.active { background: rgba(0, 120, 212, 0.8); border-color: #0078d4; color: #fff; }
    #loading {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #888; font-size: 14px;
    }
</style>
</head>
<body>
<div id="loading">Loading shape...</div>
<div id="toolbar" style="display:none">
    <button id="btnShaded" class="active" title="Shaded">Shaded</button>
    <button id="btnWire" title="Wireframe">Wire</button>
    <button id="btnFit" title="Fit All (F)">Fit</button>
    <button id="btnTop" title="Top View (T)">Top</button>
    <button id="btnFront" title="Front View">Front</button>
    <button id="btnRight" title="Right View">Right</button>
</div>
<div id="info" style="display:none">
    <span id="shapeInfo"></span>
    <span class="controls">LMB=orbit  RMB=pan  Scroll=zoom  F=fit  T=top  W/S=wire/shade</span>
</div>

<script src="{{threeUri}}"></script>
<script src="{{controlsUri}}"></script>

<script>
// ── Scene setup ─────────────────────────────────────────────────────────────

const scene = new THREE.Scene();

// Dark gradient background
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2;
bgCanvas.height = 256;
const bgCtx = bgCanvas.getContext('2d');
const grad = bgCtx.createLinearGradient(0, 0, 0, 256);
grad.addColorStop(0, '#3a3a3a');
grad.addColorStop(1, '#2a2a2a');
bgCtx.fillStyle = grad;
bgCtx.fillRect(0, 0, 2, 256);
const bgTexture = new THREE.CanvasTexture(bgCanvas);
scene.background = bgTexture;

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 10000);
camera.position.set(5, 5, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.prepend(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

// ── Lighting ────────────────────────────────────────────────────────────────

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
dirLight2.position.set(-5, -2, -5);
scene.add(dirLight2);

// ── Grid + axes ─────────────────────────────────────────────────────────────

// const gridHelper = new THREE.GridHelper(20, 20, 0xcccccc, 0xe0e0e0);
// scene.add(gridHelper);

// const axesHelper = new THREE.AxesHelper(2);
// scene.add(axesHelper);

// ── State ───────────────────────────────────────────────────────────────────

let meshGroup = null;
let wireframeMode = false;

const shadedMaterial = new THREE.MeshPhongMaterial({
    color: 0x808080,
    specular: 0x111111,
    shininess: 20,
    side: THREE.DoubleSide,
});

const wireframeMaterial = new THREE.MeshBasicMaterial({
    color: 0x808080,
    wireframe: true,
});

// ── Parse binary STL ────────────────────────────────────────────────────────

function parseBinarySTL(buffer) {
    const view = new DataView(buffer);
    const numTriangles = view.getUint32(80, true);
    const geometry = new THREE.BufferGeometry();

    const vertices = new Float32Array(numTriangles * 9);
    const normals = new Float32Array(numTriangles * 9);

    for (let i = 0; i < numTriangles; i++) {
        const offset = 84 + i * 50;
        const nx = view.getFloat32(offset, true);
        const ny = view.getFloat32(offset + 4, true);
        const nz = view.getFloat32(offset + 8, true);

        for (let v = 0; v < 3; v++) {
            const vOffset = offset + 12 + v * 12;
            const vi = i * 9 + v * 3;
            vertices[vi]     = view.getFloat32(vOffset, true);
            vertices[vi + 1] = view.getFloat32(vOffset + 4, true);
            vertices[vi + 2] = view.getFloat32(vOffset + 8, true);
            normals[vi]      = nx;
            normals[vi + 1]  = ny;
            normals[vi + 2]  = nz;
        }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    return { geometry, numTriangles };
}

// ── Load and display ────────────────────────────────────────────────────────

function loadSTL(base64Data) {
    const binary = atob(base64Data);
    const buffer = new ArrayBuffer(binary.length);
    const view = new Uint8Array(buffer);
    for (let i = 0; i < binary.length; i++) view[i] = binary.charCodeAt(i);

    const { geometry, numTriangles } = parseBinarySTL(buffer);

    if (meshGroup) scene.remove(meshGroup);
    meshGroup = new THREE.Group();

    const mesh = new THREE.Mesh(geometry, shadedMaterial);
    mesh.name = 'shape';
    meshGroup.add(mesh);

    // Edge overlay for better visibility
    const edges = new THREE.EdgesGeometry(geometry, 30);
    const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x2a2a2a, transparent: true, opacity: 0.5 });
    const edgeLines = new THREE.LineSegments(edges, edgeMaterial);
    edgeLines.name = 'edges';
    meshGroup.add(edgeLines);

    scene.add(meshGroup);
    fitAll();

    // Update info bar
    geometry.computeBoundingBox();
    const box = geometry.boundingBox;
    const size = new THREE.Vector3();
    box.getSize(size);
    document.getElementById('shapeInfo').textContent =
        numTriangles.toLocaleString() + ' triangles | ' +
        size.x.toFixed(1) + ' x ' + size.y.toFixed(1) + ' x ' + size.z.toFixed(1);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('info').style.display = 'flex';
}

// ── Camera helpers ──────────────────────────────────────────────────────────

function fitAll() {
    if (!meshGroup) return;
    const box = new THREE.Box3().setFromObject(meshGroup);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim / (2 * Math.tan(Math.PI * camera.fov / 360));

    controls.target.copy(center);
    camera.position.set(center.x + dist * 0.7, center.y + dist * 0.7, center.z + dist * 0.7);
    camera.near = maxDim * 0.001;
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();
}

function setView(x, y, z) {
    if (!meshGroup) return;
    const box = new THREE.Box3().setFromObject(meshGroup);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const dist = Math.max(size.x, size.y, size.z) / (2 * Math.tan(Math.PI * camera.fov / 360));
    controls.target.copy(center);
    camera.position.set(center.x + x * dist * 1.5, center.y + y * dist * 1.5, center.z + z * dist * 1.5);
    camera.updateProjectionMatrix();
}

function setWireframe(on) {
    wireframeMode = on;
    if (!meshGroup) return;
    var mesh = meshGroup.getObjectByName('shape');
    var edges = meshGroup.getObjectByName('edges');
    if (mesh) mesh.material = on ? wireframeMaterial : shadedMaterial;
    if (edges) edges.visible = !on;
    document.getElementById('btnShaded').classList.toggle('active', !on);
    document.getElementById('btnWire').classList.toggle('active', on);
}

// ── Toolbar ─────────────────────────────────────────────────────────────────

document.getElementById('btnShaded').onclick = function() { setWireframe(false); };
document.getElementById('btnWire').onclick = function() { setWireframe(true); };
document.getElementById('btnFit').onclick = function() { fitAll(); };
document.getElementById('btnTop').onclick = function() { setView(0, 1, 0); };
document.getElementById('btnFront').onclick = function() { setView(0, 0, 1); };
document.getElementById('btnRight').onclick = function() { setView(1, 0, 0); };

// ── Keyboard ────────────────────────────────────────────────────────────────

window.addEventListener('keydown', function(e) {
    switch (e.key.toLowerCase()) {
        case 'f': fitAll(); break;
        case 't': setView(0, 1, 0); break;
        case 'w': setWireframe(true); break;
        case 's': setWireframe(false); break;
    }
});

// ── Resize ──────────────────────────────────────────────────────────────────

window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Render loop ─────────────────────────────────────────────────────────────

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

// ── Listen for STL data from the extension ──────────────────────────────────

window.addEventListener('message', function(event) {
    var msg = event.data;
    if (msg.type === 'loadSTL') {
        loadSTL(msg.data);
    }
});

// Tell the extension we're ready
var vscodeApi = acquireVsCodeApi();
vscodeApi.postMessage({ type: 'ready' });
</script>
</body>
</html>
