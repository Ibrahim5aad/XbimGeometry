<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xbim Viewer</title>
    <base href="/" />
    <link href="Xbim.Examples.Viewer.Wasm.styles.css" rel="stylesheet" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.183.2",
        "three/": "https://esm.sh/three@0.183.2/"
      }
    }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      body { background: #1a1a2e; color: #e0e0e0; }
      #app { height: 100vh; height: 100dvh; }
      #app > main { display: contents; }

      .blazor-loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
      .blazor-loading .spinner { width: 40px; height: 40px; border: 3px solid #0f3460; border-top-color: #4cc9f0; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .blazor-loading .text { margin-top: 16px; font-size: 14px; color: #7b8794; }
      #blazor-error-ui { display: none; }
    </style>
</head>
<body>
    <div id="app">
        <div class="blazor-loading">
            <div class="spinner"></div>
            <div class="text">Loading xbim engine...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start().catch(function(err) { console.error('Blazor failed:', err); });
    </script>
</body>
</html>
